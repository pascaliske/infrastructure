---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dyndns
  namespace: dyndns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-dyndns
    namespace: flux-system
  values:
    image:
      repository: ghcr.io/pascaliske/cloudflare-dyndns
      tag: '0.3.0'
    fullnameOverride: dyndns
    cronJob:
      enabled: true
      schedule: '0 * * * *'
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      nameservers:
        - 1.1.1.1
    env:
      - name: TZ
        value: ${TIMEZONE}
      - name: DOMAIN
        value: ${DOMAIN_INTERNAL}
      - name: NAME
        value: vpn
    secret:
      create: true
      token: ${CLOUDFLARE_API_TOKEN}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
  interval: 10m0s

