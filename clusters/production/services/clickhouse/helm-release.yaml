---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  chartRef:
    kind: OCIRepository
    name: clickhouse
    namespace: flux-system
  values:
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-server
      tag: 24.12.6.70-alpine
    env:
      - name: TZ
        value: ${TIMEZONE}
      - name: CLICKHOUSE_SKIP_USER_SETUP
        value: '1'
  interval: 10m0s
