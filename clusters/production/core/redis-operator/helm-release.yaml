---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis-operator
spec:
  chart:
    spec:
      chart: redis-operator
      version: '3.3.5'
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: redis-operator
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values: # defaults: https://github.com/freshworks-oss/redis-operator/blob/master/charts/redisoperator/values.yaml
    image:
      repository: ghcr.io/freshworks-oss/redis-operator
      tag: v3.3.5
    extraEnvVars:
      - name: OPERATOR_GROUP_ID
        value: main
    monitoring:
      enabled: true
      serviceMonitor: true
  interval: 10m0s
